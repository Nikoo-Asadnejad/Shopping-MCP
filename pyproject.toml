[project]
name = "shopping-mcp"
version = "0.1.0"
description = "Read-only shopping integrations for Iranian online stores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
