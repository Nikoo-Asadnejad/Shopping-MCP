[project]
name = "shopping-mcp"
version = "0.1.0"
description = "Read-only shopping integrations for Iranian online stores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "fastmcp>=4.1,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
shopping-mcp = "shopping_mcp.interfaces.mcp:main"
shopping-probe = "shopping_mcp.infrastructure.shops.digikala.probe:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in low-volume Digikala access and schema check"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
